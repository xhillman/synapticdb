name: Quality

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Install from uv.lock rather than resolving fresh. An unpinned install
      # let CI pick up a newer ruff than the lockfile held, which failed a
      # formatting check that could not be reproduced locally.
      #
      # Pinned to 3.10, the minimum this package supports, rather than the 3.11
      # in .python-version: CI is where the floor gets tested.
      - name: Install locked development dependencies
        run: uv sync --extra dev --frozen --python 3.10
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Test with warnings as errors
        run: uv run python -W error -m pytest
      - name: Run dependency-free benchmark smoke gate
        run: uv run python -W error -m bench --profile smoke --retriever fixture --check --no-write
      - name: Run Synaptic walking-skeleton smoke gate
        run: uv run python -W error -m bench --profile smoke --retriever synaptic --check --no-write
