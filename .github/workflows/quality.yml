name: Quality

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Test with warnings as errors
        run: python -W error -m pytest
      - name: Run dependency-free benchmark smoke gate
        run: python -W error -m bench --profile smoke --retriever fixture --check --no-write
      - name: Run Synaptic walking-skeleton smoke gate
        run: python -W error -m bench --profile smoke --retriever synaptic --check --no-write
