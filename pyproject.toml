[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "synapticdb"
version = "0.1.1"
description = "A single-file memory store for AI agents where recall gets smarter with use."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Xavier Hillman" }]
keywords = ["memory", "agents", "sqlite", "retrieval", "embeddings", "vector-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "pydantic>=2,<3",
]

[project.urls]
Homepage = "https://github.com/xhillman/synapticdb"
Repository = "https://github.com/xhillman/synapticdb"
Issues = "https://github.com/xhillman/synapticdb/issues"

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.4,<4",
]
bench = [
    "faiss-cpu>=1.10",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.5",
    "sentence-transformers>=3.4,<4",
    # The archived baseline was produced on this cross-encoder runtime. Newer
    # torch releases have returned NaN logits for the locked model on macOS.
    "torch==2.3.1",
    "transformers==4.41.2",
    "tokenizers==0.19.1",
]
dev = [
    "build>=1.2",
    "mypy>=1.16,<2",
    "pytest>=8",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
filterwarnings = ["error"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
# Ruff 0.16 promoted Markdown code-block formatting out of preview, which would
# rewrite the snippets in README.md and docs/v0-prd.md. Those snippets are
# illustrative prose, not code this project builds, and reformatting them churns
# documents for no gain. Excluded explicitly so the decision does not depend on
# which ruff version a machine happens to install.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["B", "C90", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
files = ["src", "bench"]
ignore_missing_imports = true
python_version = "3.10"
strict = true
warn_unreachable = true
